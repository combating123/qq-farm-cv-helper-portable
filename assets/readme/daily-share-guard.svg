<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">每日分享控制</title><desc id="d">默认关闭自动分享，支持手动分享或指定联系人精确匹配，失败立即取消</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9EE"/><stop offset="1" stop-color="#F7FAFF"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<text x="60" y="58" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="29" font-weight="750" fill="#17345F">分享由你决定，不把“自动”变成尴尬</text><text x="60" y="88" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="15" fill="#7C8EAD">默认不开启自动分享；需要自动化时，只接受指定目标的完整匹配。</text>
<g font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif">
<g transform="translate(60 126)"><rect width="320" height="120" rx="18" fill="white" stroke="#E8D9BC"/><circle cx="34" cy="34" r="14" fill="#FFF0D0"/><path d="M27 34h14" stroke="#A76A00" stroke-width="3"/><text x="60" y="39" font-size="18" font-weight="750" fill="#17345F">默认关闭</text><text x="24" y="75" font-size="14" fill="#526985">程序不会主动打开分享窗口</text><text x="24" y="99" font-size="14" fill="#526985">手动分享保持完全可用</text></g>
<g transform="translate(440 126)"><rect width="320" height="120" rx="18" fill="white" stroke="#CFE1F7"/><circle cx="34" cy="34" r="14" fill="#E8F1FF"/><path d="M28 34l4 4 8-9" fill="none" stroke="#2176FF" stroke-width="3"/><text x="60" y="39" font-size="18" font-weight="750" fill="#17345F">精确指定</text><text x="24" y="75" font-size="14" fill="#526985">填写 share_target_name 后再开启</text><text x="24" y="99" font-size="14" fill="#526985">联系人与群组选项分开控制</text></g>
<g transform="translate(820 126)"><rect width="320" height="120" rx="18" fill="white" stroke="#F0CDD1"/><circle cx="34" cy="34" r="14" fill="#FFECEF"/><path d="M28 28l12 12M40 28L28 40" stroke="#D64C5B" stroke-width="3"/><text x="60" y="39" font-size="18" font-weight="750" fill="#17345F">失败即取消</text><text x="24" y="75" font-size="14" fill="#526985">目标为空、搜索失败或不完整匹配</text><text x="24" y="99" font-size="14" fill="#526985">均不回退到随机或首位联系人</text></g></g></svg>