<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">自动化功能全景</title><desc id="d">从窗口识别到自家经营、播种、好友巡检、日常福利和状态恢复的循环</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#9BB1CF"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#F1FBF6"/></linearGradient></defs>
<rect width="1200" height="460" rx="24" fill="url(#g)"/>
<text x="60" y="62" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="30" font-weight="750" fill="#17345F">一条可持续运行的农场自动化链路</text><text x="60" y="94" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="16" fill="#7C8EAD">每一步都有识别反馈、日志记录和异常恢复，而不是只执行一串固定坐标。</text>
<g stroke="#9BB1CF" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M240 205H330"/><path d="M500 205H590"/><path d="M760 205H850"/><path d="M1020 205C1100 205 1100 340 1020 340"/><path d="M850 340H760"/><path d="M590 340H500"/><path d="M330 340C210 340 180 290 180 255"/></g>
<g font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif">
<g transform="translate(70 155)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#E8F1FF"/><circle cx="28" cy="28" r="6" fill="none" stroke="#2176FF" stroke-width="2"/><path d="M38 38l9 9" stroke="#2176FF" stroke-width="3"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">窗口识别</text><text x="20" y="64" font-size="13" fill="#526985">定位 QQ / 微信小程序</text><text x="20" y="84" font-size="13" fill="#526985">读取画面与当前状态</text></g>
<g transform="translate(330 155)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#E9F8F1"/><path d="M28 18v20M18 28h20" stroke="#21A66F" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">自家维护</text><text x="20" y="64" font-size="13" fill="#526985">浇水、除草、除虫</text><text x="20" y="84" font-size="13" fill="#526985">收获、施肥与开垦</text></g>
<g transform="translate(590 155)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#FFF3DA"/><path d="M28 39V24M28 29c-8-8-13-2-14 2 6 1 10 0 14-2M28 24c7-8 13-3 14 1-6 2-10 1-14-1" fill="none" stroke="#B37600" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">智能播种</text><text x="20" y="64" font-size="13" fill="#526985">等级、偏好与背包优先</text><text x="20" y="84" font-size="13" fill="#526985">缺种时按策略补购</text></g>
<g transform="translate(850 155)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#F0ECFF"/><circle cx="23" cy="25" r="5" fill="none" stroke="#7654D8" stroke-width="2"/><circle cx="34" cy="25" r="5" fill="none" stroke="#7654D8" stroke-width="2"/><path d="M14 39c2-7 16-7 18 0M27 39c2-7 16-7 18 0" fill="none" stroke="#7654D8" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">好友巡检</text><text x="20" y="64" font-size="13" fill="#526985">帮助、收获与批量处理</text><text x="20" y="84" font-size="13" fill="#526985">黑名单、护主与禁偷时段</text></g>
<g transform="translate(850 290)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#FFECEC"/><path d="M20 28h16M28 20v16" stroke="#DC5C66" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">日常福利</text><text x="20" y="64" font-size="13" fill="#526985">任务、商城与礼包</text><text x="20" y="84" font-size="13" fill="#526985">按设定时间触发</text></g>
<g transform="translate(590 290)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#E8F1FF"/><path d="M20 29a9 9 0 1 0 3-7M20 20v9h9" fill="none" stroke="#2176FF" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">异常恢复</text><text x="20" y="64" font-size="13" fill="#526985">断线重连与弹窗处理</text><text x="20" y="84" font-size="13" fill="#526985">定时重启与休息窗口</text></g>
<g transform="translate(330 290)"><rect width="170" height="100" rx="16" fill="white" stroke="#DCE6F4"/><circle cx="28" cy="28" r="13" fill="#E9F8F1"/><path d="M20 22h16v13H20zM24 38h8" fill="none" stroke="#21A66F" stroke-width="2"/><text x="54" y="33" font-size="17" font-weight="700" fill="#17345F">观察与统计</text><text x="20" y="64" font-size="13" fill="#526985">运行日志与实时截图</text><text x="20" y="84" font-size="13" fill="#526985">动作次数与重启状态</text></g>
</g></svg>