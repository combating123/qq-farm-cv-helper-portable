<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">便携目录与数据同步</title><desc id="d">主程序、依赖、用户数据和启动器位于同一目录，启动前后按时间同步设置</desc>
<rect width="1200" height="330" rx="24" fill="#F7FAFF"/><text x="60" y="58" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="29" font-weight="750" fill="#17345F">一个文件夹，带走程序与历史设置</text><text x="60" y="88" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="15" fill="#7C8EAD">启动器同步便携数据与当前 Windows 用户配置；日志、缓存和临时截图不进入交付包。</text>
<g font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif">
<g transform="translate(60 126)"><rect width="310" height="150" rx="18" fill="white" stroke="#DCE6F4"/><text x="24" y="34" font-size="13" font-weight="700" fill="#2176FF">PORTABLE FOLDER</text><text x="24" y="66" font-size="18" font-weight="750" fill="#17345F">CV农场助手/</text><text x="24" y="94" font-size="14" fill="#526985">├─ 主程序与运行依赖</text><text x="24" y="119" font-size="14" fill="#526985">├─ UserData 历史设置</text><text x="24" y="144" font-size="14" fill="#526985">└─ 统一启动入口</text></g>
<g transform="translate(445 126)"><rect width="310" height="150" rx="18" fill="#EEF6FF" stroke="#CFE1F7"/><text x="24" y="34" font-size="13" font-weight="700" fill="#2176FF">SMART SYNC</text><text x="24" y="66" font-size="18" font-weight="750" fill="#17345F">按修改时间双向同步</text><text x="24" y="94" font-size="14" fill="#526985">启动前：恢复较新的历史配置</text><text x="24" y="119" font-size="14" fill="#526985">退出后：保存本次配置变化</text><text x="24" y="144" font-size="14" fill="#526985">更新时：保留 UserData 即可</text></g>
<g transform="translate(830 126)"><rect width="310" height="150" rx="18" fill="#F0FAF5" stroke="#CDEBDB"/><text x="24" y="34" font-size="13" font-weight="700" fill="#18855B">CLEAN DELIVERY</text><text x="24" y="66" font-size="18" font-weight="750" fill="#17345F">运行产物自动排除</text><text x="24" y="94" font-size="14" fill="#526985">logs / cache / screenshots</text><text x="24" y="119" font-size="14" fill="#526985">captures / 临时文件</text><text x="24" y="144" font-size="14" fill="#526985">减少体积，避免混入隐私数据</text></g>
<path d="M380 201H430" stroke="#9BB1CF" stroke-width="2"/><path d="M420 194l10 7-10 7" fill="none" stroke="#9BB1CF" stroke-width="2"/><path d="M765 201H815" stroke="#9BB1CF" stroke-width="2"/><path d="M805 194l10 7-10 7" fill="none" stroke="#9BB1CF" stroke-width="2"/>
</g></svg>