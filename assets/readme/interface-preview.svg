<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900" role="img" aria-labelledby="title desc">
  <title id="title">QQ Farm Studio dark command center interface</title>
  <desc id="desc">Dark navy workspace with mint accents, wide command rail, status cards, workflow controls, and live operation log.</desc>
  <defs>
