    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65fbd2"/><stop offset="1" stop-color="#8cffdf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1650" height="900" rx="30" fill="#02040a"/>
