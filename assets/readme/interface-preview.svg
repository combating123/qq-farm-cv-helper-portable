    <text x="300" y="502" fill="#667894">00:00:02</text><text x="388" y="502" fill="#65fbd2">[ DATA  ]</text><text x="480" y="502" fill="#cbd8ea">便携设置已从 UserData 同步。</text>
    <text x="300" y="536" fill="#667894">00:00:03</text><text x="388" y="536" fill="#65fbd2">[ LINK  ]</text><text x="480" y="536" fill="#cbd8ea">运行目标：QQ 小程序。</text>
    <text x="300" y="570" fill="#667894">00:00:04</text><text x="388" y="570" fill="#f8c56a">[ IDLE  ]</text><text x="480" y="570" fill="#cbd8ea">点击“启动工作流”开始运行。</text>
