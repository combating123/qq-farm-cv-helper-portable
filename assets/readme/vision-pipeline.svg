<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">OpenCV 视觉自动化流程</title><desc id="d">窗口画面经过模板识别、状态判断、动作执行、日志统计和异常恢复</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17345F"/><stop offset="1" stop-color="#214A78"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8CB8EA"/></marker></defs>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/><text x="60" y="58" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="29" font-weight="750" fill="white">它如何工作：从画面到动作，再回到可观察状态</text><text x="60" y="88" font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif" font-size="15" fill="#BFD2EA">视觉识别负责理解窗口，策略模块决定下一步，恢复机制保障长时间运行。</text>
<g stroke="#8CB8EA" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M240 186H294"/><path d="M458 186H512"/><path d="M676 186H730"/><path d="M894 186H948"/></g>
<g font-family="Segoe UI,Microsoft YaHei UI,PingFang SC,sans-serif">
<g transform="translate(70 130)"><rect width="170" height="112" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#739AC6"/><text x="20" y="31" font-size="12" font-weight="700" fill="#70B1FF">01 · CAPTURE</text><text x="20" y="60" font-size="18" font-weight="700" fill="white">捕获窗口画面</text><text x="20" y="86" font-size="13" fill="#C7D7EA">QQ / 微信小程序</text></g>
<g transform="translate(288 130)"><rect width="170" height="112" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#739AC6"/><text x="20" y="31" font-size="12" font-weight="700" fill="#70B1FF">02 · VISION</text><text x="20" y="60" font-size="18" font-weight="700" fill="white">OpenCV 模板识别</text><text x="20" y="86" font-size="13" fill="#C7D7EA">定位作物、按钮和状态</text></g>
<g transform="translate(506 130)"><rect width="170" height="112" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#739AC6"/><text x="20" y="31" font-size="12" font-weight="700" fill="#7EE1B5">03 · DECIDE</text><text x="20" y="60" font-size="18" font-weight="700" fill="white">策略判断</text><text x="20" y="86" font-size="13" fill="#C7D7EA">配置、优先级与时间窗</text></g>
<g transform="translate(724 130)"><rect width="170" height="112" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#739AC6"/><text x="20" y="31" font-size="12" font-weight="700" fill="#FFD36A">04 · ACT</text><text x="20" y="60" font-size="18" font-weight="700" fill="white">执行窗口操作</text><text x="20" y="86" font-size="13" fill="#C7D7EA">点击、切换与流程推进</text></g>
<g transform="translate(942 130)"><rect width="188" height="112" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#739AC6"/><text x="20" y="31" font-size="12" font-weight="700" fill="#FF9EAA">05 · OBSERVE</text><text x="20" y="60" font-size="18" font-weight="700" fill="white">记录与恢复</text><text x="20" y="86" font-size="13" fill="#C7D7EA">日志、统计、重连和重启</text></g>
</g></svg>